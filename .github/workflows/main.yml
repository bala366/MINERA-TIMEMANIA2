name: COMPILAR APK MINERADOR TIMEMANIA V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Conferir projeto
        shell: bash
        run: |
          echo "=== MINERADOR TIMEMANIA V2 ==="
          pwd
          ls -la

          echo "=== ESTRUTURA DO APP ==="
          find app -type f | sort

          echo "=== ARQUIVOS JAVA ==="
          find app/src/main/java -type f -name "*.java" -print | sort

          echo "=== MAIN ACTIVITY ==="
          find app/src/main/java -name "MainActivity.java" -print

          echo "=== MOTOR DO MINERADOR ==="
          find app/src/main/java -name "MiningEngine.java" -print

          echo "=== LEITOR DA TIMEMANIA ==="
          find app/src/main/java -name "TimemaniaParser.java" -print

          echo "=== ÍCONE ==="
          find app/src/main/res -name "ic_timemania.xml" -print

      - name: Compilar APK
        shell: bash
        run: |
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Localizar APK
        shell: bash
        run: |
          echo "=== APK GERADO ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Preparar APK com nome correto
        shell: bash
        run: |
          mkdir -p apk-final
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK NÃO FOI ENCONTRADO"
            exit 1
          fi

          cp "$APK" apk-final/MINERADOR-TIMEMANIA-V2.apk

          echo "APK preparado:"
          ls -lh apk-final/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MINERADOR-TIMEMANIA-V2-APK
          path: apk-final/MINERADOR-TIMEMANIA-V2.apk
          if-no-files-found: error
          retention-days: 30

